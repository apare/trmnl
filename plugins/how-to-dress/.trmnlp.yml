# trmnlp configuration for How to dress (local preview only, never uploaded).
---
watch:
  - .trmnlp.yml
  - src

time_zone: America/Toronto

# author_contact_method asks a public recipe for a way to reach its author;
# How to dress is a Private Plugin, never published as a recipe.
ignored_lint_rules:
  - author_contact_method

# The Lieu form field, as filled in on trmnl.com: "latitude,longitude" (here Québec).
custom_fields:
  lat_lon: 46.81,-71.21

# The weather the preview shows. `node plugins/how-to-dress/samples/use.js <name>`
# swaps in a sample day (grand-froid, neige, neige-au-sol, pluie, doux-venteux,
# canicule); `use.js live` removes it so the preview polls Open-Meteo.
# sample: live
variables: {}
